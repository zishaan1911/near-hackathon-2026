services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gasx
      MYSQL_USER: gasx
      MYSQL_PASSWORD: gasx
      MYSQL_ROOT_PASSWORD: gasx
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pgasx"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      GASX_API_DATABASE_URL: mysql://gasx:gasx@mysql:3306/gasx
      GASX_NEAR_NETWORK: ${GASX_NEAR_NETWORK:-testnet}
      GASX_NEAR_RPC_URL: ${GASX_NEAR_RPC_URL:-https://test.rpc.fastnear.com}
      GASX_NEAR_CONTRACT_ID: ${GASX_NEAR_CONTRACT_ID:-}
      GASX_NEAR_COLLATERAL_TOKEN: ${GASX_NEAR_COLLATERAL_TOKEN:-}
      GASX_NEAR_DEV_MARKET: ${GASX_NEAR_DEV_MARKET:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_NEAR_NETWORK: ${GASX_NEAR_NETWORK:-testnet}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

  # Live-chain services; start with `docker compose --profile live up`.
  publisher:
    build:
      context: .
      dockerfile: Dockerfile.near-services
    restart: unless-stopped
    profiles: ["live"]
    env_file: .env
    environment:
      GASX_PUBLISH_API_URL: ${GASX_PUBLISH_API_URL:-http://api:3000}
    depends_on:
      - api

  matcher:
    build:
      context: .
      dockerfile: Dockerfile.near-services
    command: ["npx", "tsx", "src/matcher.ts"]
    restart: unless-stopped
    profiles: ["live"]
    env_file: .env
    depends_on:
      - api

volumes:
  mysql-data:
