[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
description = "Testnet-only NEP-141 'tUSDC' (6 decimals) with a public faucet, used as Silica collateral"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
